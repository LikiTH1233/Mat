<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternity Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: sans-serif; background-color: #f1f5f9; } </style>
</head>
<body class="text-slate-800">

    <header class="bg-rose-600 shadow-md text-white py-4 px-6 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-2xl font-bold tracking-tight">Eternity Match</h1>
        <div id="navButtons" class="hidden flex gap-3">
            <button onclick="toggleEditProfile()" id="editBtn" class="bg-rose-700 hover:bg-rose-800 px-4 py-2 rounded shadow transition">Edit Profile</button>
            <button onclick="logoutClient()" class="bg-slate-900 hover:bg-black px-4 py-2 rounded shadow transition">Logout</button>
        </div>
    </header>

    <main id="authScreen" class="max-w-5xl mx-auto px-4 py-12 grid md:grid-cols-2 gap-10">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
            <h3 class="text-2xl font-bold mb-6 text-slate-700">Create New Profile</h3>
            <form id="registerForm" class="space-y-4 text-sm">
                <input type="text" id="regUser" placeholder="Choose a Username" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-rose-500">
                <input type="password" id="regPass" placeholder="Choose a Password" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-rose-500">
                <input type="text" id="name" placeholder="Full Name" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-rose-500">
                <div class="flex gap-4">
                    <input type="date" id="dob" required class="w-1/2 p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none text-slate-500">
                    <select id="gender" required class="w-1/2 p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none">
                        <option value="">Gender</option><option value="Male">Male</option><option value="Female">Female</option>
                    </select>
                </div>
                <input type="text" id="city" placeholder="City of Residence" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-rose-500">
                <input type="text" id="phone" placeholder="Contact Phone Number" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-rose-500">
                <textarea id="biodata" placeholder="Write a short biodata" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-rose-500 h-24"></textarea>
                
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 space-y-3">
                    <label class="block text-slate-800 font-bold mb-2">Upload Your Photos</label>
                    <div><span class="text-xs font-semibold text-slate-600">Photo 1 (Main)</span><input type="file" id="photo1" accept="image/*" required class="w-full p-2 bg-white border border-slate-200 rounded"></div>
                    <div><span class="text-xs font-semibold text-slate-600">Photo 2 (Required)</span><input type="file" id="photo2" accept="image/*" required class="w-full p-2 bg-white border border-slate-200 rounded"></div>
                    <div><span class="text-xs font-semibold text-slate-600">Photo 3 (Required)</span><input type="file" id="photo3" accept="image/*" required class="w-full p-2 bg-white border border-slate-200 rounded"></div>
                    <div class="pt-2 border-t border-blue-200"><span class="text-xs font-semibold text-slate-500">Photo 4 (Optional)</span><input type="file" id="photo4" accept="image/*" class="w-full p-2 bg-white border border-slate-200 rounded"></div>
                </div>

                <button type="submit" class="w-full bg-rose-500 text-white font-bold py-3 rounded-lg hover:bg-rose-600 transition shadow-lg mt-2">Submit Profile</button>
            </form>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 h-fit">
            <h3 class="text-2xl font-bold mb-6 text-slate-700">Already a Member?</h3>
            <form id="loginForm" class="space-y-4">
                <input type="text" id="loginUser" placeholder="Username" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-rose-500">
                <input type="password" id="loginPass" placeholder="Password" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-rose-500">
                <button type="submit" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-slate-900 transition shadow-lg">Secure Login</button>
            </form>
        </div>
    </main>

    <main id="dashboardScreen" class="hidden max-w-6xl mx-auto px-4 py-10">
        <div id="matchesSection">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-4 rounded-xl shadow border border-slate-200">
                <div class="flex items-center gap-3">
                    <h2 class="text-2xl font-bold text-slate-800">Available Matches</h2>
                    <span id="premiumBadge" class="hidden bg-gradient-to-r from-yellow-400 to-yellow-500 text-yellow-900 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider shadow">Premium Active</span>
                </div>
                <button onclick="loadMatches()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-lg shadow font-semibold transition flex items-center gap-2">🔄 Refresh Matches</button>
            </div>
            <div id="matchesContainer" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>

        <div id="editProfileSection" class="hidden bg-white p-8 rounded-2xl shadow-xl max-w-3xl mx-auto border border-slate-200">
            <h2 class="text-2xl font-bold mb-6 text-slate-800">Update Profile Information</h2>
            <form id="editForm" class="space-y-5 text-sm">
                <input type="text" id="editName" placeholder="Full Name" required class="w-full p-3 bg-slate-50 border rounded-lg">
                <div class="flex gap-4">
                    <input type="date" id="editDob" required class="w-1/2 p-3 bg-slate-50 border rounded-lg">
                    <select id="editGender" required class="w-1/2 p-3 bg-slate-50 border rounded-lg">
                        <option value="Male">Male</option><option value="Female">Female</option>
                    </select>
                </div>
                <input type="text" id="editCity" placeholder="City" required class="w-full p-3 bg-slate-50 border rounded-lg">
                <input type="text" id="editPhone" placeholder="Phone Number" required class="w-full p-3 bg-slate-50 border rounded-lg">
                <textarea id="editBiodata" required class="w-full p-3 bg-slate-50 border rounded-lg h-28"></textarea>
                
                <div class="bg-slate-100 p-5 rounded-lg border border-slate-300 border-dashed space-y-3">
                    <label class="block text-slate-800 font-bold mb-1">Replace Photos (Optional)</label>
                    <p class="text-xs text-slate-500 mb-3">Leave these empty to keep current photos.</p>
                    <div><span class="text-xs font-semibold text-slate-600">New Photo 1</span><input type="file" id="editPhoto1" accept="image/*" class="w-full p-2 bg-white border border-slate-200 rounded"></div>
                    <div><span class="text-xs font-semibold text-slate-600">New Photo 2</span><input type="file" id="editPhoto2" accept="image/*" class="w-full p-2 bg-white border border-slate-200 rounded"></div>
                    <div><span class="text-xs font-semibold text-slate-600">New Photo 3</span><input type="file" id="editPhoto3" accept="image/*" class="w-full p-2 bg-white border border-slate-200 rounded"></div>
                    <div class="pt-2 border-t border-slate-300"><span class="text-xs font-semibold text-slate-500">New Photo 4 (Optional)</span><input type="file" id="editPhoto4" accept="image/*" class="w-full p-2 bg-white border border-slate-200 rounded"></div>
                </div>

                <div class="flex gap-4 pt-4">
                    <button type="submit" class="w-full bg-emerald-500 text-white font-bold py-3 rounded-lg shadow hover:bg-emerald-600 transition">Save Changes</button>
                    <button type="button" onclick="toggleEditProfile()" class="w-full bg-slate-300 text-slate-800 font-bold py-3 rounded-lg shadow hover:bg-slate-400 transition">Cancel</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        if (localStorage.getItem('clientToken')) showDashboard();
        window.matchGallery = {};

        function getAge(dateString) { return Math.floor((new Date() - new Date(dateString)) / 31557600000); }
        function getAuthHeaders() { return { 'Authorization': `Bearer ${localStorage.getItem('clientToken')}`, 'Content-Type': 'application/json' }; }
        
        // Image Compressor to prevent Vercel/MongoDB crashes
       
       // --- SUPER COMPRESSOR FOR VERCEL ---
function fileToBase64(file) {
    return new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                // Squish the image down to 500px wide to easily pass Vercel's 4.5MB limit
                const MAX_WIDTH = 500; 
                let width = img.width;
                let height = img.height;
                if (width > MAX_WIDTH) { 
                    height = height * (MAX_WIDTH / width); 
                    width = MAX_WIDTH; 
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // Compress to 50% quality (still looks great on phones, but file size is tiny!)
                resolve(canvas.toDataURL('image/jpeg', 0.5)); 
            };
        };
    });
}

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('photo1').files[0];
            const p2 = document.getElementById('photo2').files[0];
            const p3 = document.getElementById('photo3').files[0];
            const p4 = document.getElementById('photo4').files[0];

            const photosArray = [];
            if (p1) photosArray.push(await fileToBase64(p1));
            if (p2) photosArray.push(await fileToBase64(p2));
            if (p3) photosArray.push(await fileToBase64(p3));
            if (p4) photosArray.push(await fileToBase64(p4));

            if (photosArray.length < 3) return alert("❌ You must upload at least 3 photos.");

            const user = {
                username: document.getElementById('regUser').value, password: document.getElementById('regPass').value,
                name: document.getElementById('name').value, dob: document.getElementById('dob').value,
                gender: document.getElementById('gender').value, city: document.getElementById('city').value,
                phone: document.getElementById('phone').value, biodata: document.getElementById('biodata').value,
                photos: photosArray
            };
            
            // USING VERCEL RELATIVE PATH
            const res = await fetch('/api/client/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(user) });
            const data = await res.json();
            alert(data.message || data.error);
            if(res.ok) e.target.reset();
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/client/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: document.getElementById('loginUser').value, password: document.getElementById('loginPass').value })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('clientToken', data.token);
                localStorage.setItem('isPremium', data.isPremium);
                showDashboard();
            } else { alert("❌ " + data.error); }
        });

        function logoutClient() {
            localStorage.clear();
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('navButtons').classList.add('hidden');
            document.getElementById('loginForm').reset();
        }

        function showDashboard() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('navButtons').classList.remove('hidden');
            document.getElementById('matchesSection').classList.remove('hidden');
            document.getElementById('editProfileSection').classList.add('hidden');
            document.getElementById('editBtn').innerText = "Edit Profile";
            
            if(localStorage.getItem('isPremium') === 'true') {
                document.getElementById('premiumBadge').classList.remove('hidden');
                document.getElementById('premiumBadge').classList.add('inline-block');
            } else { document.getElementById('premiumBadge').classList.add('hidden'); }
            loadMatches();
        }

        function swapImage(matchId, photoIndex) { document.getElementById(`main-img-${matchId}`).src = window.matchGallery[matchId][photoIndex]; }

        async function loadMatches() {
            const res = await fetch('/api/client/matches', { headers: getAuthHeaders() });
            if (res.status === 401 || res.status === 403) { alert("Session expired."); return logoutClient(); }

            const matches = await res.json();
            const container = document.getElementById('matchesContainer');
            const isPremium = localStorage.getItem('isPremium') === 'true';
            window.matchGallery = {};

            if(matches.length === 0) {
                container.innerHTML = `<p class="text-slate-500 col-span-full text-center py-10">No matches available right now. Check back later!</p>`;
                return;
            }

            container.innerHTML = matches.map(match => {
                const age = getAge(match.dob);
                window.matchGallery[match._id] = match.photos;
                
                let photoSection = `<div class="relative bg-slate-900"><img id="main-img-${match._id}" src="${match.photos[0]}" class="w-full h-72 object-contain transition-all duration-300"></div>`;

                if (!isPremium) {
                    photoSection += `<div class="bg-rose-50 text-rose-700 text-xs text-center p-3 font-bold border-b border-rose-100 uppercase tracking-wide">🔒 1 of ${match.totalPhotos} photos shown. Premium Required.</div>`;
                } else if (match.photos.length > 1) {
                    const thumbs = match.photos.map((p, index) => `<img src="${p}" onclick="swapImage('${match._id}', ${index})" class="w-16 h-16 object-cover rounded shadow-sm border-2 border-transparent hover:border-rose-500 cursor-pointer transition transform hover:scale-105">`).join('');
                    photoSection += `<div class="flex gap-3 p-3 bg-slate-100 border-b overflow-x-auto justify-center">${thumbs}</div>`;
                }

                const phoneHtml = match.phone.includes('Upgrade')
                    ? `<span class="bg-slate-200 text-slate-500 px-3 py-1 rounded-md text-xs font-bold shadow-sm">🔒 Phone Hidden</span>`
                    : `<span class="text-rose-600 font-bold text-sm bg-rose-50 px-3 py-1 rounded-md border border-rose-100 shadow-sm">📞 ${match.phone}</span>`;

                return `
                <div class="bg-white rounded-xl shadow-lg hover:shadow-xl transition duration-300 border border-slate-200 flex flex-col overflow-hidden">
                    ${photoSection}
                    <div class="p-5 flex-grow flex flex-col">
                        <h4 class="text-xl font-bold text-slate-800">${match.name}</h4>
                        <p class="text-sm text-slate-500 mb-3 font-medium">${age} yrs • ${match.gender} • 📍 ${match.city}</p>
                        <p class="text-sm text-slate-600 italic mb-4 line-clamp-3 leading-relaxed">"${match.biodata}"</p>
                        <div class="mt-auto border-t border-slate-100 pt-4 flex justify-between items-center">
                            ${phoneHtml}
                        </div>
                    </div>
                </div>`
            }).join('');
        }

        async function toggleEditProfile() {
            const matchesSec = document.getElementById('matchesSection');
            const editSec = document.getElementById('editProfileSection');
            const editBtn = document.getElementById('editBtn');

            if (matchesSec.classList.contains('hidden')) {
                showDashboard(); 
            } else {
                matchesSec.classList.add('hidden');
                editSec.classList.remove('hidden');
                editBtn.innerText = "Cancel Edit";
                
                const res = await fetch('/api/client/profile', { headers: getAuthHeaders() });
                const user = await res.json();
                
                document.getElementById('editName').value = user.name;
                document.getElementById('editDob').value = user.dob;
                document.getElementById('editGender').value = user.gender;
                document.getElementById('editCity').value = user.city;
                document.getElementById('editPhone').value = user.phone;
                document.getElementById('editBiodata').value = user.biodata;
            }
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const updatedUser = {
                name: document.getElementById('editName').value, dob: document.getElementById('editDob').value,
                gender: document.getElementById('editGender').value, city: document.getElementById('editCity').value,
                phone: document.getElementById('editPhone').value, biodata: document.getElementById('editBiodata').value
            };

            const ep1 = document.getElementById('editPhoto1').files[0];
            const ep2 = document.getElementById('editPhoto2').files[0];
            const ep3 = document.getElementById('editPhoto3').files[0];
            const ep4 = document.getElementById('editPhoto4').files[0];

            const editPhotosArray = [];
            if (ep1) editPhotosArray.push(await fileToBase64(ep1));
            if (ep2) editPhotosArray.push(await fileToBase64(ep2));
            if (ep3) editPhotosArray.push(await fileToBase64(ep3));
            if (ep4) editPhotosArray.push(await fileToBase64(ep4));

            if (editPhotosArray.length > 0) {
                if (editPhotosArray.length < 3) return alert("❌ If updating photos, you must upload at least 3.");
                updatedUser.photos = editPhotosArray;
            }

            const res = await fetch('/api/client/profile', {
                method: 'PUT', headers: getAuthHeaders(), body: JSON.stringify(updatedUser)
            });

            if (res.ok) {
                alert('✅ Profile updated successfully!');
                document.getElementById('editPhoto1').value = "";
                document.getElementById('editPhoto2').value = "";
                document.getElementById('editPhoto3').value = "";
                document.getElementById('editPhoto4').value = "";
                showDashboard(); 
            } else { alert('❌ Failed to update profile.'); }
        });
    </script>
</body>
</html>
